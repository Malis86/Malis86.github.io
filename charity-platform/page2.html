<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Thank You | HopeRise Charity</title>

        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <style>

            *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            }

            body{
            font-family:'Poppins', sans-serif;
            background:linear-gradient(135deg,#0d6efd,#4dabf7);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            text-align:center;
            padding:20px;
            }

            .response-container{
            background:white;
            color:#222;
            padding:60px 40px;
            border-radius:20px;
            max-width:600px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);

            animation:fadeIn 1s ease;
            }

            .checkmark{
            font-size:80px;
            color:#28a745;
            margin-bottom:20px;
            }

            h1{
            font-size:42px;
            margin-bottom:20px;
            }

            p{
            font-size:18px;
            margin-bottom:30px;
            color:#555;
            }

            .btn{
            display:inline-block;
            padding:14px 30px;
            background:#0d6efd;
            color:white;
            text-decoration:none;
            border-radius:50px;
            font-weight:600;
            transition:0.3s;
            }

            .btn:hover{
            background:#0056d2;
            transform:translateY(-3px);
            }

            @keyframes fadeIn{
            from{
            opacity:0;
            transform:translateY(20px);
            }

            to{
            opacity:1;
            transform:translateY(0);
            }
            }

        </style>
    </head>

    <body>

        <div class="response-container">

            <div class="checkmark">✓</div>

            <h1>Thank You!</h1>

            <p>
                Your submission has been received successfully.
                hank you for supporting HopeRise and helping
                families and young people build brighter futures.
            </p>

            <a href="index.html" class="btn">
                Return Home
            </a>

        </div>

    </body>
</html>
